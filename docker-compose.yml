version: '3.8'

networks:
  taskboard-network:
    driver: bridge
    name: taskboard-network
  db-network:
    driver: bridge
    internal: true
    name: taskboard-db-network

volumes:
  api_logs:
    driver: local
  frontend_logs:
    driver: local
  db_data:
    driver: local

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: taskboard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
      POSTGRES_USER: ${POSTGRES_USER:-taskboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data:Z
    networks:
      - db-network
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskboard_user} -d ${POSTGRES_DB:-taskboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: taskboard-api
    environment:
      ENV: ${ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskboard_user}:${POSTGRES_PASSWORD:-SecurePassword123!}@db:5432/${POSTGRES_DB:-taskboard}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-change-me}
    volumes:
      - api_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - taskboard-network
      - db-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flask Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: taskboard-frontend
    environment:
      FASTAPI_URL: http://api:8000
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-me}
      ENV: ${ENV:-production}
    volumes:
      - frontend_logs:/app/logs
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - taskboard-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
